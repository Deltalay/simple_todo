[package]
name = "api_gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = [
    "postgres",
    "runtime-tokio",
    "macros",
    "time",
] }
dotenvy = "0.15"
prost = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
actix-web = "4"
actix-cors = "0.7"
serde = {version="1.0", features = ["derive"]}
serde_json = "1.0"

[build-dependencies]
tonic-prost-build = "0.14"
